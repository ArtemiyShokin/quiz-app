<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/styles.css" />
    <title>Quiz Ant</title>
  </head>
  <body>
    <header class="header">
      <h1 class="header__header-title">ANTquiz</h1>
    </header>
    <nav class="navbar">
      <ul class="navbar__buttons-list">
        <li class="navbar__navbar-button">
          <a href="./index.html">
            <img
              class="home-button"
              src="./assets/home-white.png"
              alt="home button"
              height="50rem"
          /></a>
        </li>
        <li class="navbar__navbar-button">
          <a href="./bookmarks.html"
            ><img
              class="bookmark-button"
              src="./assets/bookmark-white.png"
              alt="bookmark button"
              height="50rem"
          /></a>
        </li>
        <li class="navbar__navbar-button">
          <a href="./profile.html"
            ><img
              class="profile-button"
              src="./assets/user.png"
              alt="profile page button"
              height="50rem"
          /></a>
        </li>
      </ul>
    </nav>
    <main>
      <section class="user-presentation">
        <img
          src="./assets/user-userton.jpg"
          alt="profile picture"
          height="200rem"
          width="200rem"
          class="user-presentation__profile-pic"
        />
        <h2>User Userton</h2>
      </section>
      <section class="about-me">
        <h3>About Me</h3>
        <p>
          Lorem ipsum dolor sit amet consectetur adipisicing elit. Ab, eligendi
          vitae quaerat praesentium, officia, animi veniam odio a facilis eos
          quia debitis minus! Impedit quidem ab, hic laudantium nostrum dolore!
        </p>
      </section>
      <ul class="counters">
        <li class="counters__objects">Questions</li>
        <li class="counters__objects">
          <img src="./assets/bookmark.png" alt="bookmark icon" height="40rem" />
          4
        </li>
      </ul>
      <h4 class="settings__header">Settings</h4>
      <section class="settings">
        <p>Dark Mode</p>
        <input type="checkbox" class="dark-mode">
        
        </input>
      </section>
    </main>
  </body>
</html>
